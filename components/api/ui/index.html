<!doctype html>
<!-- SPDX-License-Identifier: MIT
     DFU32 web UI (SPEC.md §10.2). One file, no framework. The build
     (tools/dfu32_ui.py) inlines web/staging.js where it says @dfu32-include,
     then gzips. Everything goes through the JSON API, and every value from
     the device or a BLE advertiser is put in the page as text. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFU32</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f24;--mute:#68707c;--line:#dde1e6;--acc:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#0e7490;--chip:#eef1f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d21;--fg:#e6e8eb;--mute:#9aa3ae;--line:#2c3138;--acc:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#22d3ee;--chip:#23272d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:1.1rem;letter-spacing:.02em}
header .sp{flex:1}
nav{display:flex;gap:.25rem;padding:.4rem 1rem;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:.35rem .7rem;border-radius:6px;color:var(--mute);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--chip);color:var(--fg);font-weight:600}
main{max-width:60rem;margin:0 auto;padding:1rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
h2{font-size:1rem;margin:0 0 .75rem}
h3{font-size:.9rem;margin:1rem 0 .5rem;color:var(--mute)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem}
.grid dt{color:var(--mute)}
.grid dd{margin:0;word-break:break-all}
.mute{color:var(--mute)}
.small{font-size:.85rem}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--chip)}
.b-ok{color:var(--ok)}.b-bad{color:var(--bad)}.b-warn{color:var(--warn)}.b-info{color:var(--info)}.b-acc{color:var(--acc)}
.bar{height:.6rem;background:var(--chip);border-radius:99px;overflow:hidden;margin:.6rem 0 .3rem}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.note{padding:.6rem .8rem;border-radius:8px;background:var(--chip);margin:.6rem 0}
.n-bad{border-left:4px solid var(--bad)}.n-warn{border-left:4px solid var(--warn)}.n-info{border-left:4px solid var(--info)}
button,.btn{font:inherit;padding:.45rem .9rem;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dng{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:.4rem .5rem;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
label,.opt{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
label.chk{flex-direction:row;align-items:center;gap:.4rem;color:var(--fg);font-size:.95rem}
.lt{display:flex;align-items:center;gap:.35rem}
.q{flex:none;width:1.15rem;height:1.15rem;padding:0;border-radius:50%;font-size:.72rem;font-weight:700;line-height:1;color:var(--mute);background:var(--card)}
.q:hover,.q[aria-expanded=true]{color:var(--acc);border-color:var(--acc)}
.hint{max-width:26rem;padding:.4rem .55rem;border-radius:6px;background:var(--chip);color:var(--fg);font-size:.8rem;line-height:1.4;cursor:default}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.7rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
tr.click{cursor:pointer}
tr.click:hover{background:var(--chip)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem;overflow:auto;max-height:28rem;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:0}
code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--chip);padding:.05rem .3rem;border-radius:4px}
details summary{cursor:pointer;color:var(--mute);margin:.5rem 0}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:8px;max-width:90vw;display:none}
.center{max-width:28rem;margin:3rem auto}
.drop{outline:2px dashed transparent;outline-offset:-2px}
.drop.over{outline-color:var(--acc)}
@media (max-width:40rem){.grid{grid-template-columns:1fr}.grid dt{margin-top:.3rem}}
</style>
</head>
<body>
<header><b>DFU32</b><span id="hdr" class="mute small"></span><span class="sp"></span><span id="hjob"></span></header>
<nav id="nav" hidden>
<a href="#status">Status</a><a href="#image">Image</a><a href="#target">Target</a><a href="#runs">Runs</a><a href="#logs">Logs</a><a href="#system">System</a>
</nav>
<main id="main"></main>
<div id="toast"></div>
<script>
"use strict";
// ---- tiny helpers -------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
// h("div.cls", {attr}, child...) builds elements; strings become text nodes.
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split(".");
  const e = document.createElement(name);
  if (cls.length) e.className = cls.join(" ");
  if (attrs && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const kB = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : n >= 1024 ? (n / 1024).toFixed(1) + " kB" : n + " B";
const dur = (ms) => ms >= 60000 ? Math.floor(ms / 60000) + " min " + Math.round(ms % 60000 / 1000) + " s" : (ms / 1000).toFixed(1) + " s";
const when = (unix) => unix ? new Date(unix * 1000).toLocaleString() : "";
const short = (hex) => hex ? hex.slice(0, 12) + "…" : "";
function toast(msg, ms = 4000) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); }
function badge(text, kind) { return h("span.badge" + (kind ? ".b-" + kind : ""), text); }
function dl(pairs) { const d = h("dl.grid"); for (const [k, v] of pairs) if (v !== undefined && v !== null && v !== "") d.append(h("dt", k), h("dd", v)); return d; }
function note(kind, ...kids) { return h("div.note.n-" + kind, ...kids); }
// A labelled control with a "?" beside the label: it opens a short explanation of
// what the option is and where its value comes from. chk = a checkbox row.
// The "?" and the explanation sit outside the <label>, which would otherwise
// label the button (its first control) and not the field.
let optN = 0;
function opt(text, help, el, chk) {
  const hint = h("span.hint", { hidden: true }, help);
  const q = h("button.q", { type: "button", "aria-label": "About: " + text, "aria-expanded": "false", onclick: () => {
    hint.hidden = !hint.hidden; q.setAttribute("aria-expanded", String(!hint.hidden));
  } }, "?");
  q.title = hint.textContent;
  if (chk) return h("div.opt", h("span.lt", h("label.chk", el, text), q), hint);
  el.id = "o" + ++optN;
  return h("div.opt", h("span.lt", h("label", { for: el.id }, text), q), el, hint);
}

// ---- API --------------------------------------------------------------------------------
const TOKEN_KEY = "dfu32.token";
let token = "";
let newToken = "";  // a token just issued here, shown under System → Access until dismissed
try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
function setToken(t) { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
// A 401 means the device requires a token this browser doesn't have (any more): back to sign-in.
function onUnauthorized() { setToken(""); newToken = ""; if (status) status.device.claimed = true; route(); }
class ApiError extends Error { constructor(status, body) { super((body && (body.detail || body.error)) || "HTTP " + status); this.status = status; this.body = body; } }
async function api(method, path, body) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;
  let data;
  if (body !== undefined) { headers["Content-Type"] = "application/json"; data = JSON.stringify(body); }
  const r = await fetch("/api/v1" + path, { method, headers, body: data, cache: "no-store" });
  let j = null;
  if (r.status !== 204) { try { j = await r.json(); } catch (e) {} }
  if (r.status === 401) { onUnauthorized(); throw new ApiError(401, j); }
  if (!r.ok) throw new ApiError(r.status, j);
  return j;
}
// Runs an action, reports errors as a toast, and disables the button meanwhile.
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { if (e.status !== 401) toast(e.message); }
  finally { if (btn) btn.disabled = false; }
}

// ---- state ------------------------------------------------------------------------------
let status = null, cfg = null, view = "", timer = 0;
const STATE_KIND = { IDLE: "", SUCCEEDED: "ok", STAGED: "ok", FAILED: "bad", AWAITING_TARGET: "info", DFU_RUNNING: "acc", RADIO_HANDOVER: "acc", RESTORING: "acc" };
const active = (j) => j && !["IDLE", "SUCCEEDED", "FAILED", "STAGED"].includes(j.state);
const targetId = () => status && status.targets && status.targets[0] ? status.targets[0].id : "";

async function refresh() {
  clearTimeout(timer);
  try {
    status = await (await fetch("/api/v1/status", { cache: "no-store" })).json();
    header();
    if (view === "status") renderStatus();
  } catch (e) { $("#hdr").textContent = "offline: retrying…"; }
  timer = setTimeout(refresh, active(status && status.job) ? 1000 : 10000);
}
function header() {
  const d = status.device || {}, w = d.wifi || {};
  $("#hdr").textContent = [d.hostname, d.version, w.connected ? ((cfg && cfg.wifi_ssid) || "WiFi") + " " + w.rssi + " dBm" : "WiFi down"].filter(Boolean).join(" · ");
  const j = status.job;
  $("#hjob").replaceChildren(j && j.id ? badge(j.state.replace(/_/g, " ").toLowerCase(), STATE_KIND[j.state]) : "");
}

// ---- router -----------------------------------------------------------------------------
const VIEWS = { status: viewStatus, image: viewImage, target: viewTarget, runs: viewRuns, logs: viewLogs, system: viewSystem };
async function route() {
  stopLogs();
  if (!status) await refresh();
  if (!status) return;
  // Token auth is opt-in: with no token set on the device, everything is open.
  if (!status.device.claimed) { if (token) setToken(""); newToken = ""; }
  else if (!token) return viewToken();
  $("#nav").hidden = false;
  if (!cfg) cfg = await api("GET", "/config").catch(() => null);
  const [name, arg] = (location.hash.slice(1) || "status").split("/");
  view = VIEWS[name] ? name : "status";
  for (const a of document.querySelectorAll("#nav a")) a.classList.toggle("on", a.getAttribute("href") === "#" + view);
  VIEWS[view](arg);
}
window.addEventListener("hashchange", route);

// ---- sign in (only when the device requires a token) -----------------------------------
function viewToken() {
  $("#nav").hidden = true;
  const inp = h("input", { placeholder: "API token", autocomplete: "off", spellcheck: "false" });
  const btn = h("button.pri", { onclick: () => act(btn, async () => {
    setToken(inp.value.trim());
    try { await api("GET", "/config"); } catch (e) { setToken(""); throw new Error(e.status === 429 ? e.message : "That token was not accepted."); }
    route();
  }) }, "Sign in");
  $("#main").replaceChildren(h("section.center", h("h2", "Sign in"),
    h("p", "This DFU32 requires an API token. Paste the one shown when the token was turned on."),
    h("div.row", inp, btn),
    h("p.mute.small", "Lost it? On the console run ", h("code", "token rotate"), " for a new one or ", h("code", "token clear"), " to turn the token off, or hold the button 5–15 s to turn it off.")));
}

// ---- status -----------------------------------------------------------------------------
let checkResult = null, tcfg = null;
// The target's own settings (authenticated): whether it has a manifest URL to fetch from.
async function viewStatus() {
  const tid = targetId();
  tcfg = tid ? await api("GET", "/targets/" + tid).catch(() => null) : null;
  renderStatus();
}
function renderStatus() {
  const j = status.job || {}, tid = targetId(), busy = active(j);
  const out = [];
  const sec = h("section", h("h2", "Job"));
  if (!j.id) sec.append(h("p.mute", "No job since boot."));
  else {
    sec.append(h("div.row", badge(j.state.replace(/_/g, " ").toLowerCase(), STATE_KIND[j.state]), h("span.mute", j.kind + " from " + j.source + (j.phase ? " · " + j.phase : ""))));
    if (j.bytes_total) {
      const pct = Math.min(100, Math.round(100 * j.bytes_done / j.bytes_total));
      sec.append(h("div.bar", h("i", { style: "width:" + pct + "%" })), h("div.small.mute", kB(j.bytes_done) + " of " + kB(j.bytes_total) + " (" + pct + "%)" + (j.rate_bps ? " · " + (j.rate_bps / 1000).toFixed(1) + " kB/s" : "") + (j.attempt ? " · attempt " + j.attempt + " of " + j.max_attempts : "")));
    }
    if (j.state === "AWAITING_TARGET") sec.append(note("info", "Run ", h("code", "start ota"), " on the repeater now (USB, or remotely over LoRa from the companion app). Giving up in " + j.arm_remaining_s + " s."));
    if (j.wifi_off && busy && ["RADIO_HANDOVER", "DFU_RUNNING"].includes(j.state)) sec.append(note("info", "WiFi is off for the transfer; this page catches up when it is back."));
    if (j.error) sec.append(note("bad", j.error));
    if (j.target_erased && j.state === "FAILED") sec.append(note("warn", "The repeater's app was erased. It waits in its bootloader (usually at MAC+1): flash again with source \"staged\" to recover."));
    if (j.version) sec.append(dl([["Image", j.version], ["Bootloader", j.bootloader], ["Run", j.run ? h("a", { href: "#runs/" + j.run }, "#" + j.run) : ""]]));
  }
  out.push(sec);

  const a = h("section", h("h2", "Actions"));
  if (!tid) a.append(h("p", "No target yet. ", h("a", { href: "#target" }, "Set one up"), " first."));
  else {
    const c = actionControls(tid, !!(tcfg && tcfg.manifest_url));
    c.bCheck.disabled = c.bStage.disabled = c.bFlash.disabled = busy;
    c.bAbort.disabled = !busy;
    a.append(c.row1, c.row2);
    if (!c.fetches) a.append(h("p.mute.small", "The target has no manifest URL, so it flashes the staged image. ", status.staged ? "Add a manifest URL to fetch images from a server." : [h("a", { href: "#image" }, "Upload one"), " first, or add a manifest URL to fetch images from a server."]));
    if (checkResult) {
      const r = checkResult;
      a.append(h("h3", "Manifest"), dl([["Version", r.version + (r.update_available ? " (new)" : " (already flashed)")], ["For ID", (r.boards || []).join(", ") + (r.board_ok ? (r.target_board ? "" : " (the target has no ID: not compared)") : " — does not include " + r.target_board)], ["Image", r.bin ? kB(r.bin.size) + " · sha256 " + short(r.bin.sha256) : ""], ["Staged", r.staged_same ? "same image" : r.staged_version || "nothing"], ["Created", r.created], ["Notes", r.notes]]));
      if (!r.board_ok) a.append(note("bad", "This manifest is not for the target's ID (\"" + r.target_board + "\"): staging and flashing would stop with BOARD_MISMATCH."));
    }
  }
  out.push(a);

  const s = status.staged, t = status.targets && status.targets[0];
  out.push(h("section", h("div.row", h("h2", { style: "margin:0;flex:1" }, "Staged image"), h("a", { href: "#image" }, s ? "Manage" : "Upload one")), h("div", { style: "margin-top:.75rem" }, s ? stagedInfo(s) : h("p.mute", "Nothing staged."))));
  if (t) out.push(h("section", h("h2", "Target"), dl([["ID", t.board || h("span.mute", "not set (images aren't compared with it)")], ["Last flashed", t.last_ok_version ? t.last_ok_version + (t.last_ok_at ? " · " + when(t.last_ok_at) : "") : "never (by this DFU32)"]])));
  $("#main").replaceChildren(...out);
}

// The action controls are built once per target and reused, so the 1 s status
// refresh never resets what someone is in the middle of choosing.
let actCtl = null;
function actionControls(tid, fetches) {
  if (actCtl && actCtl.tid === tid && actCtl.fetches === fetches) return actCtl;
  const c = { tid, fetches };
  c.force = h("input", { type: "checkbox" });
  c.source = h("select", fetches ? h("option", { value: "manifest" }, "manifest (fetch)") : null, h("option", { value: "staged" }, "staged image"));
  c.wifiOff = h("input", { type: "checkbox", checked: cfg && cfg.wifi_off_dfu });
  c.arm = h("input", { type: "number", min: 10, max: 3600, placeholder: "default", style: "width:7rem" });
  c.bCheck = h("button", { onclick: () => act(c.bCheck, async () => { checkResult = await api("POST", "/targets/" + tid + "/check"); renderStatus(); }) }, "Check");
  c.bStage = h("button", { onclick: () => act(c.bStage, async () => { await api("POST", "/targets/" + tid + "/stage", { force: c.force.checked }); toast("Staging…"); refresh(); }) }, "Stage");
  c.bFlash = h("button.pri", { onclick: () => act(c.bFlash, async () => {
    const body = { source: c.source.value, wifi_off: c.wifiOff.checked };
    if (c.arm.value) body.arm_timeout_s = Number(c.arm.value);
    await api("POST", "/targets/" + tid + "/flash", body);
    toast("Armed: run start ota on the repeater");
    refresh();
  }) }, "Flash");
  c.bAbort = h("button.dng", { onclick: () => {
    const j = status.job || {};
    if (j.target_erased || j.state === "DFU_RUNNING") {
      if (!confirm("The transfer has started: aborting leaves the repeater erased until it is flashed again. Abort?")) return;
    }
    act(c.bAbort, async () => { const r = await api("POST", "/jobs/current/abort"); if (r.warning) toast(r.warning, 8000); refresh(); });
  } }, "Abort");
  c.row1 = h("div.row", fetches ? [c.bCheck, c.bStage, opt("re-download", "Makes Stage download the image again even when the same one is already staged. Normally the staged copy is checked and reused.", c.force, true)] : null, c.bFlash, c.bAbort);
  c.row2 = h("div.row", { style: "margin-top:.7rem" },
    opt("Flash from", fetches ? "Where Flash takes the image. manifest: fetch it from the target's manifest URL first (reusing the staged copy if it is the same). staged image: flash what the Image page shows, with no download." : "Flash sends the staged image: the one the Image page shows. With a manifest URL on the target, DFU32 can fetch images from a server instead.", c.source),
    opt("Arm timeout (s)", "For this flash only: how long DFU32 waits for the repeater to appear after you press Flash, which is the time you have to run start ota on it. 10–3600 s. Blank uses the target's setting (Target → Tuning, 600 s unless changed).", c.arm),
    opt("WiFi off during the transfer", "Stops DFU32's WiFi while the image is sent, so its radio serves Bluetooth alone; this page is unreachable meanwhile and catches up afterwards. Starts out as the default from System → Settings.", c.wifiOff, true));
  return (actCtl = c);
}

// ---- image (what is staged for the repeater) --------------------------------------------
// A DFU package is unpacked here, in the browser, by web/staging.js: the installer
// page's reader (inlined below at build time, tools/dfu32_ui.py). DFU32 gets the
// .bin as the body and the .dat in the query (POST /staging), and repeats the
// checks. The image isn't tied to the target.
// The checks DFU32 repeats, done first so a wrong file is caught before uploading.
async function loadPackage(file) {
  const S = window.dfu32Staging;
  if (!S) throw new Error("this page's package reader didn't load");
  if (file.size > S.MAX_ZIP) throw new Error("it is far too large for a DFU package");
  try {
    const { bin, dat } = await S.loadPackage(new Uint8Array(await file.arrayBuffer()));
    const pkt = S.validate(bin, dat);
    return { bin, dat, type: pkt.deviceType, sd: pkt.sdReq.map(S.h4) };
  } catch (e) {
    throw new Error(e instanceof S.StageError ? e.message : "it is not a readable zip (" + e.message + ")");
  }
}
// The file name rides in the query as a label: clip it so the request stays well
// inside DFU32's 1 KB URI limit, whatever characters it has.
function clipName(n) { n = n.slice(0, 64); while (encodeURIComponent(n).length > 192) n = n.slice(0, -1); return n; }
function stagedFrom(u) { return /^(upload|usb)(:|$)/.test(u) ? (u.startsWith("usb") ? "USB (installer page)" : "upload") + (u.includes(":") ? ": " + u.slice(u.indexOf(":") + 1) : "") : u; }
function stagedInfo(s) {
  return dl([["Version", s.version], ["ID", s.board || "not set (not compared with the target's)"], ["Size", kB(s.bin_size)], ["SHA-256", short(s.sha256)], ["Staged", when(s.staged_at)], ["From", stagedFrom(s.manifest_url)]]);
}

function viewImage() {
  const t = status.targets && status.targets[0];
  const out = h("div");
  function staged() {
    const s = status.staged, msg = h("div");
    const verify = h("button", { onclick: () => act(verify, async () => {
      const r = await api("GET", "/staging?verify=1");
      msg.replaceChildren(r.verified ? note("info", "Verified: the .bin matches its SHA-256 and the .dat's CRC16.") : note("bad", "Verification failed: " + (r.verify_error || r.header)));
    }) }, "Verify");
    const clear = h("button.dng", { onclick: () => { if (confirm("Clear the staged image? Flashing from the staged image fails until another is staged.")) act(clear, async () => { await api("DELETE", "/staging"); toast("Cleared"); await refresh(); out.firstChild.replaceWith(staged()); }); } }, "Clear");
    return h("section", h("h2", "Staged image"), s ? [stagedInfo(s), h("div.row", { style: "margin-top:.7rem" }, verify, clear), msg] : h("p.mute", "Nothing staged."));
  }
  const file = h("input", { type: "file", accept: ".zip,application/zip" });
  const form = h("div");
  async function pick(f) {
    form.replaceChildren(h("p.mute", "Checking " + f.name + "…"));
    let pkg;

        opt("ID (optional)", "What this image is built for, such as rak4631. If the target has an ID too, the two must match (capitals don't matter) or DFU32 refuses to flash. If either is blank, nothing is compared. The package doesn't carry it: type the same ID you gave the target.", board)),

// ---- target -----------------------------------------------------------------------------
// The firmware's tuning defaults (dfu32_core/target_config.hpp), shown as placeholders.
const kDef = { interval_ms: 30, prn: 4, max_attempts: 3, arm_timeout_s: 600, start_settle_ms: 500, prn_timeout_ms: 5000 };
const NUM = ["addr_type", "max_app_size", "prn", "interval_ms", "max_attempts", "arm_timeout_s", "start_settle_ms", "prn_timeout_ms"];

  }) }, "Save");
  const del = h("button.dng", { hidden: !tid, onclick: () => { if (confirm("Delete the target and its settings?")) act(del, async () => { await api("DELETE", "/targets/" + tid); toast("Deleted"); await refresh(); viewTarget(); }); } }, "Delete");
  const form = h("section", h("h2", tid ? "Target" : "New target"),
    h("div.form",
      field("mac", "App MAC (required)", ["The repeater's Bluetooth address while it runs its normal firmware: the only setting a flash needs. Run ", h("code", "start ota"), " on the repeater (USB console, or remotely from the companion app): its reply shows the address. Or run it and press Scan below, then Use as target. DFU32 finds the bootloader at this address or the next one up."], { placeholder: "AA:BB:CC:DD:EE:FF" }),
      opt("Address type", "The kind of Bluetooth address the MAC is. nRF52 boards, MeshCore repeaters among them, use random. Scan below shows the type for each device and Use as target fills it in.", f.addr_type),
      field("board", "ID (optional)", "A name for what this repeater is, such as its board: rak4631. Choose it yourself. When the staged image has an ID too (the one typed when staging it on the Image page, or the boards a manifest lists), the two must match (capitals don't matter) or DFU32 refuses to flash, which keeps another board's image off this repeater. If either is blank, nothing is compared. Up to 31 characters, no spaces.", { placeholder: "rak4631" }),
      field("manifest_url", "Manifest URL (optional)", ["Only for fetching images from a server: the http:// address of the manifest.json that ", h("code", "tools/dfu32_pack.py"), " writes next to the image, on a web server DFU32 can reach. HTTPS isn't supported. Leave it blank to upload images on the Image page instead."], { placeholder: "http://server/rak4631/manifest.json" })),
    h("details", h("summary", "Tuning"), h("p.mute.small", "The defaults suit most repeaters. Clear a field and save to go back to its default."), h("div.form",
      knob("interval_ms", "Interval (ms)", kDef.interval_ms, 15, 100, "The BLE connection interval DFU32 asks for during the transfer, 15–100 ms, rounded down to a multiple of 1.25; default 30. Shorter is faster (about one packet per interval): on the bench 15, 20 and 30 worked, and the OTAFIX bootloader lost the link at 11.25 and below, so 15 is the floor. A run's page shows the interval each attempt used."),

      knob("max_attempts", "Attempts (1-10)", kDef.max_attempts, 1, 10, "How many times a flash tries the transfer before it fails; default 3. A retry after a lost link runs slower."),
      knob("arm_timeout_s", "Arm timeout (s)", kDef.arm_timeout_s, 10, 3600, ["How long DFU32 waits for the repeater to appear after Flash, 10–3600 s; default 600. It is the time you have to run ", h("code", "start ota"), ". The Status page can override it for one flash."]),
      knob("start_settle_ms", "START settle (ms)", kDef.start_settle_ms, 0, 5000, "Pause between the START command and the image size that follows it, 0–5000 ms; default 500. The bootloader silently drops the size if it arrives too soon. Raise it only if runs fail right at START."),
      knob("prn_timeout_ms", "Receipt timeout (ms)", kDef.prn_timeout_ms, 500, 60000, "How long DFU32 waits for each receipt before the attempt counts as failed, 500–60000 ms; default 5000. Raise it if a run's log shows receipt timeouts while the link is still up."),
      knob("max_app_size", "Max app size (B)", "0 = default", 0, 16777216, "The largest image DFU32 will send, in bytes. 0 (or blank) uses the default for the image's chip: 798720 for nRF52. Change it only if this repeater's bootloader leaves a different amount of room for the app; it must be a multiple of 4."))),
    h("div.row", { style: "margin-top:.8rem" }, save, del),

  $("#main").replaceChildren(form, scanSection((mac, type) => { f.mac.value = mac; f.addr_type.value = type === "public" ? "0" : "1"; toast("Filled in the MAC: save to keep it"); }));
}
function scanSection(use) {

        h("td", d.dfu ? d.dfu.replace("_", " ") : "", d.matches_target ? [" ", badge("target", "ok")] : ""),

}

// ---- runs -------------------------------------------------------------------------------
const RESULT_KIND = { SUCCEEDED: "ok", FAILED: "bad", ABORTED_BY_REBOOT: "warn" };
async function viewRuns(seq) {
  if (seq) return viewRun(seq);
  const tid = targetId();
  if (!tid) return $("#main").replaceChildren(h("section", h("p", "No target yet.")));
  const r = await api("GET", "/targets/" + tid + "/runs").catch((e) => { toast(e.message); return { runs: [] }; });
  r.runs = r.runs || [];
  $("#main").replaceChildren(h("section", h("h2", "Runs"), !r.runs.length ? h("p.mute", "No runs recorded yet.") :
    h("table", h("tr", h("th", "#"), h("th", "Result"), h("th", "When"), h("th", "Took"), h("th", "Image / error")),
      r.runs.map((x) => h("tr.click", { onclick: () => location.hash = "#runs/" + x.seq },
        h("td", x.seq), h("td", badge(String(x.result).toLowerCase().replace(/_/g, " "), RESULT_KIND[x.result]), x.target_erased === "yes" && x.result !== "SUCCEEDED" ? [" ", badge("erased", "warn")] : ""),
        h("td.small", x.started_unix ? when(x.started_unix) : "uptime " + x.started_uptime_s + " s"), h("td", dur(x.duration_ms || 0)),
        h("td.small", x.error || x.image_version))))));
}
async function viewRun(seq) {
  const r = await api("GET", "/runs/" + seq).catch((e) => { toast(e.message); return null; });
  if (!r) return;
  const x = r.run;
  $("#main").replaceChildren(h("section", h("p", h("a", { href: "#runs" }, "← Runs")), h("h2", "Run #" + x.seq + " "), badge(x.result.toLowerCase().replace(/_/g, " "), RESULT_KIND[x.result]),
    dl([["Error", x.error], ["Started", x.started_unix ? when(x.started_unix) : "uptime " + x.started_uptime_s + " s"], ["Took", dur(x.duration_ms)], ["Trigger", [x.trigger, x.source].filter(Boolean).join(", ")],
      ["Image", x.image_version + " · " + kB(x.image_size)], ["Target", [x.target_id, x.target].filter(Boolean).join(" · ")], ["Target erased", x.target_erased],
      ["Bootloader", x.bootloader + (x.bootloader_class ? " (" + x.bootloader_class + ")" : "")], ["Link", x.mtu ? "MTU " + x.mtu + ", " + x.packet_size + " B packets, interval " + (x.conn_interval_x125 * 1.25) + " ms" : ""],
      ["Throughput", x.rate_x10_kBps ? (x.rate_x10_kBps / 10) + " kB/s" : ""], ["WiFi", x.wifi_off ? "off during the transfer" : "on"], ["Last phase", x.last_phase]]),
    x.attempts && x.attempts.length ? [h("h3", "Attempts"), h("table", h("tr", h("th", "#"), h("th", "Interval"), h("th", "PRN"), h("th", "Outcome"), h("th", "Acked")),
      x.attempts.map((t) => h("tr", h("td", t.n), h("td", t.interval_ms + " ms"), h("td", t.prn), h("td.small", t.outcome + (t.kind && t.kind !== "NONE" ? " [" + t.kind + "]" : "")), h("td", kB(t.bytes_acked)))))] : "",

}

// ---- logs -------------------------------------------------------------------------------
let logTimer = 0, logNext = null, logPaused = false;
function stopLogs() { clearTimeout(logTimer); logTimer = 0; }
function viewLogs() {
  const pre = h("pre", { style: "max-height:70vh" });
  const pause = h("button", { onclick: () => { logPaused = !logPaused; pause.textContent = logPaused ? "Resume" : "Pause"; if (!logPaused) poll(); } }, logPaused ? "Resume" : "Pause");
  $("#main").replaceChildren(h("section", h("div.row", h("h2", { style: "margin:0;flex:1" }, "Log"), pause, h("button", { onclick: () => pre.textContent = "" }, "Clear")), h("div", { style: "margin-top:.7rem" }, pre)));
  logNext = null;
  async function poll() {
    stopLogs();
    if (view !== "logs" || logPaused) return;
    try {
      const r = await api("GET", "/logs" + (logNext === null ? "" : "?since=" + logNext));
      logNext = r.next;
      if (r.text) {
        const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
        pre.append(r.text);
        if (pre.textContent.length > 200000) pre.textContent = pre.textContent.slice(-150000);
        if (atEnd) pre.scrollTop = pre.scrollHeight;
      }
    } catch (e) {}
    logTimer = setTimeout(poll, 2000);
  }
  poll();
}

// ---- system -----------------------------------------------------------------------------
async function viewSystem() {
  cfg = await api("GET", "/config").catch(() => cfg);
  if (!cfg) return $("#main").replaceChildren(h("section", h("p", "Could not load the settings.")));
  const d = status.device, w = d.wifi || {};
  const host = h("input", { value: cfg.hostname, placeholder: cfg.hostname_active });
  const ntp = h("input", { value: cfg.ntp_server, placeholder: "pool.ntp.org" });
  const wifiOff = h("input", { type: "checkbox", checked: cfg.wifi_off_dfu });
  const deadline = h("input", { type: "number", value: cfg.dfu_deadline_max_s, min: 120, max: 7200 });
  const save = h("button.pri", { onclick: () => act(save, async () => {
    cfg = await api("PUT", "/config", { hostname: host.value.trim(), ntp_server: ntp.value.trim(), wifi_off_dfu: wifiOff.checked, dfu_deadline_max_s: Number(deadline.value) });
    toast(cfg.reboot_required ? "Saved: reboot for the new hostname / NTP server" : "Saved", 6000);
  }) }, "Save");

  const file = h("input", { type: "file", accept: ".bin" });
  const force = h("input", { type: "checkbox" });
  const prog = h("div");
  const upload = h("button.pri", { onclick: () => {
    const f = file.files[0];
    if (!f) return toast("Choose dfu32-<board>.bin first (the app image, not the -merged one)");
    if (!confirm("Install " + f.name + " (" + kB(f.size) + ") and reboot?")) return;
    upload.disabled = true;
    const bar = h("i", { style: "width:0" });
    prog.replaceChildren(h("div.bar", bar), h("div.small.mute", "Uploading…"));
    const x = new XMLHttpRequest();
    x.open("POST", "/api/v1/system/ota" + (force.checked ? "?force=1" : ""));
    if (token) x.setRequestHeader("Authorization", "Bearer " + token);
    x.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = Math.round(100 * e.loaded / e.total) + "%"; };
    x.onload = () => {
      let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 401) { onUnauthorized(); return; }
      if (x.status !== 200) { upload.disabled = false; prog.replaceChildren(note("bad", j.detail || j.error || "Upload failed (HTTP " + x.status + ")")); return; }
      prog.replaceChildren(note("info", "Installed " + j.version + ". Rebooting; waiting for it to come back…"));
      waitBack(j.version, prog);
    };
    x.onerror = () => { upload.disabled = false; prog.replaceChildren(note("bad", "Upload failed (connection lost)")); };
    x.send(f);
  } }, "Install");

  const reboot = h("button.dng", { onclick: () => { if (confirm("Reboot DFU32?")) act(reboot, async () => {
    await api("POST", "/system/reboot" + (active(status.job) ? "?force=1" : "")); toast("Rebooting…"); setTimeout(refresh, 8000);
  }); } }, "Reboot");
  // A new token is kept in this browser and shown below the Access buttons until dismissed.
  const showToken = (t) => { setToken(t); newToken = t; status.device.claimed = true; return viewSystem(); };
  const access = [];
  if (d.claimed) {
    const rotate = h("button", { onclick: () => { if (confirm("Issue a new API token? The old one stops working everywhere (scripts, Home Assistant).")) act(rotate, async () => {
      showToken((await api("POST", "/system/token/rotate")).token);
    }); } }, "Rotate token");
    const off = h("button", { onclick: () => { if (confirm("Stop requiring a token? Anyone who can reach DFU32 on your network can then use this page and the API.")) act(off, async () => {
      await api("POST", "/system/token/clear"); setToken(""); newToken = ""; status.device.claimed = false; viewSystem(); toast("Token turned off");
    }); } }, "Turn off token");
    access.push(h("p.mute.small", "An API token is required for everything but the status summary."),
      h("div.row", rotate, off, h("button", { onclick: () => { setToken(""); newToken = ""; route(); } }, "Sign out of this browser"), reboot));
  } else {
    const on = h("button", { onclick: () => act(on, async () => { showToken((await api("POST", "/claim")).token); }) }, "Require a token");
    access.push(h("p.mute.small", "No token is set: anyone who can reach DFU32 on your network can use this page and the API. Require a token to lock it down; each browser then signs in once."),
      h("div.row", on, reboot));
  }

  $("#main").replaceChildren(
    h("section", h("h2", "Device"), dl([["Firmware", d.version + (cfg.partition ? " (" + cfg.partition + ")" : "")], ["Board", d.board], ["Hostname", d.hostname + ".local"], ["Uptime", dur(d.uptime_s * 1000)],
      ["WiFi", w.connected ? (cfg.wifi_ssid || "") + " · " + w.ip + " · " + w.rssi + " dBm" : "not connected"], ["Clock", d.unix_time ? when(d.unix_time) : "not synced"], ["BLE", d.busy ? "in use: " + d.busy : "free"]])),
    h("section", h("h2", "Settings"), h("div.form",
        opt("Hostname", "DFU32's name on your network: it answers at http://<hostname>.local/. Lowercase letters, digits and '-', up to 31. Blank goes back to the default, dfu32- and the last four digits of its MAC. Takes effect after a reboot.", host),
        opt("NTP server", "The time server DFU32 asks for the clock that dates run records. Blank uses pool.ntp.org; give a server on your network if it has no internet. Takes effect after a reboot.", ntp),
        opt("Run deadline cap (s)", "The longest a flash may run once the repeater is found, 120–7200 s; default 1200. DFU32 works out a deadline from the image size and the number of attempts, and this caps it: when it passes, DFU32 drops the link and brings WiFi back.", deadline)),
      h("div.row", { style: "margin-top:.7rem" }, opt("Stop WiFi during transfers by default", "Whether Flash starts with \"WiFi off during the transfer\" ticked. With WiFi off, DFU32's radio serves Bluetooth alone, and this page is unreachable until the transfer ends. The Status page can still change it for one flash.", wifiOff, true), save)),
    h("section", h("h2", "Firmware update"), h("p.mute.small", "Upload the app image for this board: dfu32-<board>.bin from a release (dfu32.bin from a CI build), not the -merged.bin. If the new firmware can't bring WiFi and this page back within 90 s, it rolls back by itself."),
      h("div.row", file, opt("allow another board's build", "Skips the check that the file was built for this DFU32's board (shown under Device above). Leave it off unless you are moving to a different build on purpose: firmware for other hardware may not boot, and DFU32 then rolls back.", force, true), upload), prog),
    h("section", h("h2", "Access"), ...access,
      newToken ? [note("info", "New token (saved in this browser; copy it for scripts or Home Assistant: once dismissed it is never shown again):"), h("pre", newToken),
        h("button", { onclick: () => { newToken = ""; viewSystem(); } }, "Done, I copied it")] : null));
}
async function waitBack(version, prog) {
  const until = Date.now() + 150000;
  await new Promise((r) => setTimeout(r, 5000));
  while (Date.now() < until) {
    try {
      const s = await (await fetch("/api/v1/status", { cache: "no-store" })).json();
      status = s; header();
      prog.replaceChildren(note(s.device.version === version ? "info" : "warn", s.device.version === version ? "Back up on " + version + "." : "Back up, but on " + s.device.version + ": the new firmware rolled back. Check the console log."));
      return;
    } catch (e) { await new Promise((r) => setTimeout(r, 3000)); }
  }
  prog.replaceChildren(note("warn", "No answer after 2.5 minutes. Check the device's console."));
}
