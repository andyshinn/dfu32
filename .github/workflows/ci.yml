name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases build from the tag in this run and attach the merged images; the
  # latest stable release also redeploys the installer page (SPEC §9.4).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests & layout checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      # The baseline guards nvs/runlog/staging: moving them breaks updates
      # from the installer page that keep settings (SPEC §9.4).
      - name: Partition tables
        run: python3 tools/check_partitions.py --baseline partitions/baseline.json partitions/4mb.csv:4M partitions/8mb.csv:8M

      - name: Web UI size budget
        run: python3 tools/dfu32_ui.py check components/api/ui/index.html

      - name: Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # Generated from the lock files; fails if a dependency changed without
      # regenerating it, or has no license entry (MILESTONES M5).
      - name: Third-party notices
        run: python3 tools/dfu32_notices.py --check

      - name: Configure
        run: cmake -S test/host -B build-host -G Ninja

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  # The firmware matrix comes from CMakePresets.json, so a new board only needs
  # its boards/<name>/ profile and a preset. Checking them here first means a
  # mismatch fails this job with a clear error before any firmware job starts.
  boards:
    name: Board list
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v7

      - name: Board presets
        run: python3 tools/check_presets.py

      # Assign first: a failing command substitution inside echo's arguments
      # wouldn't fail the step.
      - id: list
        name: List presets
        run: |
          boards=$(python3 tools/build_all.py --list --json)
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  firmware:
    # The release name is unchanged so existing required checks still match.
    name: Firmware (${{ matrix.board }}${{ matrix.variant == 'debug' && '-debug' || '' }})
    needs: boards
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
        # debug is the same firmware with the fault-injection endpoints, for
        # the bench runner's safety checks (tools/dfu32_bench.py, section 4).
        # Its own job so it builds in parallel with the release image.
        variant: [release, debug]
    defaults:
      run:
        shell: bash
    env:
      # idf.py passes -DCCACHE_ENABLE=1 to CMake, which wraps the compilers in
      # ccache (preinstalled in the espressif/idf image). Set job-wide so the
      # merge-bin invocation sees the same value and doesn't reconfigure.
      IDF_CCACHE_ENABLE: 1
      CCACHE_MAXSIZE: 500M
      # Hash the compiler binary rather than its mtime, which can change when
      # the image tag is rebuilt even though the toolchain is identical.
      CCACHE_COMPILERCHECK: content
      BUILD_DIR: build/${{ matrix.board }}${{ matrix.variant == 'debug' && '-debug' || '' }}
    steps:
      # Full history and tags, so ESP-IDF's `git describe` gives the firmware
      # version (v0.4.0, or v0.4.0-3-gabc1234 between tags) instead of a bare
      # hash. It shows in /api/v1/status and Improv device info.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ${{ github.workspace }} is the host path in container jobs, so derive
      # container paths from $GITHUB_WORKSPACE at runtime instead. The cache
      # key embeds the IDF version read from the image itself, so it can't
      # drift from the container tag above; bump "v1" to drop all caches.
      # Each variant gets its own cache: the debug option changes sdkconfig.h,
      # which nearly every object depends on, so they share little anyway.
      - name: Configure ccache
        id: ccache-config
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          idf_ver=$(sed -n 's/^set(IDF_VERSION_\(MAJOR\|MINOR\|PATCH\) \([0-9]*\))$/\2/p' \
            "$IDF_PATH/tools/cmake/version.cmake" | paste -sd.)
          test -n "$idf_ver" || { echo "::error::could not read IDF version"; exit 1; }
          echo "key-prefix=ccache-v1-idf${idf_ver}-${{ matrix.board }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

      # Every run saves under a unique key. Caches are scoped to the ref that
      # saved them, and a restore-keys prefix match searches the current ref
      # first, then the base branch: a PR run gets its own latest cache for
      # this board and variant, falling back to main's on its first run.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-config.outputs.key-prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.key-prefix }}-

      - name: Build
        if: matrix.variant == 'release'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py --preset "${{ matrix.board }}" build

      - name: Build (debug, bench only)
        if: matrix.variant == 'debug'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py --preset "${{ matrix.board }}" -B "$BUILD_DIR" -DDFU32_DEBUG_ENDPOINTS=ON build
          grep -q '^CONFIG_DFU32_DEBUG_ENDPOINTS=y' "$BUILD_DIR/sdkconfig"
          cp "$BUILD_DIR/dfu32.bin" "$BUILD_DIR/dfu32-${{ matrix.board }}-debug.bin"

      # The Component Manager rewrites the lock if the committed one doesn't
      # match what it resolves, and creates it if it is missing. Either way
      # the committed pin was not what this build used. Both variants resolve
      # the same lock, so the release job alone checks it.
      - name: Component lock unchanged
        if: matrix.variant == 'release'
        run: |
          if [ -n "$(git status --porcelain -- 'dependencies.lock*')" ]; then
            git status --short -- 'dependencies.lock*'
            git diff -- 'dependencies.lock*'
            echo "::error::the build changed dependencies.lock.*; build this profile locally and commit the result"
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      # Saved even when the build fails: a partially warm cache still helps
      # the next attempt.
      - name: Save ccache
        if: always() && steps.ccache-restore.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      # Where the bytes go, so a budget failure (next step) says what grew.
      - name: Size by component
        if: matrix.variant == 'release'
        run: |
          . "$IDF_PATH/export.sh"
          # Into a file first: piping straight into `head` kills idf.py with SIGPIPE.
          idf.py -B "$BUILD_DIR" size-components > size-components.txt 2>&1
          head -45 size-components.txt

      # Release-only: the budget leaves headroom in the image that ships. The
      # bench-only debug build just has to fit its OTA slot, which the IDF
      # build already enforces.
      - name: App size budget
        if: matrix.variant == 'release'
        run: python3 tools/check_app_size.py "$BUILD_DIR"

      # The firmware upload checks this tag at a fixed offset; prove the
      # linker put it there in the real image.
      - name: Board tag in dfu32.bin
        run: python3 tools/check_board_tag.py "$BUILD_DIR/dfu32.bin" "${{ matrix.board }}"

      - name: Merged image (single file, flash at 0x0)
        if: matrix.variant == 'release'
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --preset "${{ matrix.board }}" merge-bin -o "dfu32-${{ matrix.board }}-merged.bin"

      - name: Upload artifacts
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: dfu32-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/dfu32-${{ matrix.board }}-merged.bin
            build/${{ matrix.board }}/ota_data_initial.bin
            build/${{ matrix.board }}/dfu32.bin
            build/${{ matrix.board }}/dfu32.elf
            build/${{ matrix.board }}/bootloader/bootloader.bin
            build/${{ matrix.board }}/partition_table/partition-table.bin
            build/${{ matrix.board }}/flasher_args.json
            build/${{ matrix.board }}/project_description.json
            build/${{ matrix.board }}/sdkconfig
            dependencies.lock.*
          if-no-files-found: warn

      # Its own artifact, so nothing that picks up dfu32-<board> for a
      # release can ship the fault-injection build by accident.
      - name: Upload debug build (bench only, never release)
        if: matrix.variant == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: dfu32-${{ matrix.board }}-debug
          path: ${{ env.BUILD_DIR }}/dfu32-${{ matrix.board }}-debug.bin
          if-no-files-found: error

  # Whether this run updates the installer page. Pushes to main deploy, so the
  # page always offers the latest main build while DFU32 is pre-release. A
  # release deploys only if it is the latest stable one, so a pre-release or a
  # patch to an older line never replaces the page.
  pages-gate:
    name: Installer page (deploy?)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          deploy=false
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" = refs/heads/main ]; then
              deploy=true
            else
              echo "$REF is not main: page left alone"
            fi
          elif [ "$EVENT" = release ]; then
            if [ "$PRERELEASE" = true ]; then
              echo "$TAG is a pre-release: page left alone"
            else
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
              if [ "$latest" = "$TAG" ]; then
                deploy=true
              else
                echo "$TAG is not the latest release ($latest): page left alone"
              fi
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # web/ plus one manifest and its parts per board, served from Pages. The
  # parts must come from Pages itself: release-asset downloads don't send
  # CORS headers, so the page couldn't fetch them.
  pages:
    name: Installer page
    needs: [boards, host, firmware, pages-gate]
    if: needs.pages-gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Only this run's builds; the -debug artifacts are downloaded too but
      # never read.
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: dfu32-*
          path: artifacts

      - name: Assemble site
        env:
          BOARDS: ${{ needs.boards.outputs.boards }}
        run: |
          mkdir -p _site
          cp -R web/. _site/
          for b in $(jq -r '.[]' <<<"$BOARDS"); do
            python3 tools/dfu32_web_manifest.py "artifacts/dfu32-$b/build/$b" \
              --board "$b" --site _site --baseline partitions/baseline.json
          done
          # The page shows one version for every board.
          versions=$(jq -r .version _site/manifest-*.json | sort -u)
          if [ "$(wc -l <<<"$versions")" -ne 1 ]; then
            echo "::error::boards were built at different versions: $versions"
            exit 1
          fi
          echo "### Installer page: $versions" >> "$GITHUB_STEP_SUMMARY"
          # ESP Web Tools from the npm tarball, checked against a pinned SHA-256.
          python3 tools/fetch_esp_web_tools.py --site _site
          cp THIRD_PARTY_NOTICES _site/THIRD_PARTY_NOTICES.txt
          find _site -type f | sort

      # pages-gate ran before this job waited for the pages concurrency group,
      # so a newer release may have been published (and deployed) meanwhile.
      - name: Still the latest release?
        id: recheck
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is no longer the latest release ($latest): page left alone"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.recheck.outputs.deploy != 'false'
        with:
          path: _site

      - id: deploy
        if: steps.recheck.outputs.deploy != 'false'
        uses: actions/deploy-pages@v5

  # Fresh-install images for esptool users, on every published release
  # (pre-releases included), with THIRD_PARTY_NOTICES. They reset settings;
  # the page never uses them.
  # They appear once the firmware matrix finishes, a few minutes after the
  # release is published; until then releases/latest/download/... 404s.
  # --clobber lets a re-run of this job (after a failed upload) replace a
  # partial set with images built from the same tag.
  release-assets:
    name: Release images
    needs: [boards, host, firmware]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: THIRD_PARTY_NOTICES
          sparse-checkout-cone-mode: false

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: dfu32-*
          path: artifacts

      - name: Attach merged images and notices
        env:
          GH_TOKEN: ${{ github.token }}
          BOARDS: ${{ needs.boards.outputs.boards }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          files=()
          for b in $(jq -r '.[]' <<<"$BOARDS"); do
            files+=("artifacts/dfu32-$b/build/$b/dfu32-$b-merged.bin")
          done
          files+=(THIRD_PARTY_NOTICES)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
