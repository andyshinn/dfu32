name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host tests & layout checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Partition tables
        run: python3 tools/check_partitions.py partitions/4mb.csv:4M partitions/8mb.csv:8M

      - name: Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Configure
        run: cmake -S test/host -B build-host -G Ninja

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  # The firmware matrix comes from CMakePresets.json, so a new board only needs
  # its boards/<name>/ profile and a preset. Checking them here first means a
  # mismatch fails this job with a clear error before any firmware job starts.
  boards:
    name: Board list
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v7

      - name: Board presets
        run: python3 tools/check_presets.py

      # Assign first: a failing command substitution inside echo's arguments
      # wouldn't fail the step.
      - id: list
        name: List presets
        run: |
          boards=$(python3 tools/build_all.py --list --json)
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  firmware:
    # The release name is unchanged so existing required checks still match.
    name: Firmware (${{ matrix.board }}${{ matrix.variant == 'debug' && '-debug' || '' }})
    needs: boards
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.boards) }}
        # debug is the same firmware with the fault-injection endpoints, for
        # the bench runner's safety checks (tools/dfu32_bench.py, section 4).
        # Its own job so it builds in parallel with the release image.
        variant: [release, debug]
    defaults:
      run:
        shell: bash
    env:
      # idf.py passes -DCCACHE_ENABLE=1 to CMake, which wraps the compilers in
      # ccache (preinstalled in the espressif/idf image). Set job-wide so the
      # merge-bin invocation sees the same value and doesn't reconfigure.
      IDF_CCACHE_ENABLE: 1
      CCACHE_MAXSIZE: 500M
      # Hash the compiler binary rather than its mtime, which can change when
      # the image tag is rebuilt even though the toolchain is identical.
      CCACHE_COMPILERCHECK: content
      BUILD_DIR: build/${{ matrix.board }}${{ matrix.variant == 'debug' && '-debug' || '' }}
    steps:
      # Full history and tags, so ESP-IDF's `git describe` gives the firmware
      # version (v0.4.0, or v0.4.0-3-gabc1234 between tags) instead of a bare
      # hash. It shows in /api/v1/status and Improv device info.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ${{ github.workspace }} is the host path in container jobs, so derive
      # container paths from $GITHUB_WORKSPACE at runtime instead. The cache
      # key embeds the IDF version read from the image itself, so it can't
      # drift from the container tag above; bump "v1" to drop all caches.
      # Each variant gets its own cache: the debug option changes sdkconfig.h,
      # which nearly every object depends on, so they share little anyway.
      - name: Configure ccache
        id: ccache-config
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          idf_ver=$(sed -n 's/^set(IDF_VERSION_\(MAJOR\|MINOR\|PATCH\) \([0-9]*\))$/\2/p' \
            "$IDF_PATH/tools/cmake/version.cmake" | paste -sd.)
          test -n "$idf_ver" || { echo "::error::could not read IDF version"; exit 1; }
          echo "key-prefix=ccache-v1-idf${idf_ver}-${{ matrix.board }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

      # Every run saves under a unique key. Caches are scoped to the ref that
      # saved them, and a restore-keys prefix match searches the current ref
      # first, then the base branch: a PR run gets its own latest cache for
      # this board and variant, falling back to main's on its first run.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-config.outputs.key-prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.key-prefix }}-

      - name: Build
        if: matrix.variant == 'release'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py --preset "${{ matrix.board }}" build

      - name: Build (debug, bench only)
        if: matrix.variant == 'debug'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py --preset "${{ matrix.board }}" -B "$BUILD_DIR" -DDFU32_DEBUG_ENDPOINTS=ON build
          grep -q '^CONFIG_DFU32_DEBUG_ENDPOINTS=y' "$BUILD_DIR/sdkconfig"
          cp "$BUILD_DIR/dfu32.bin" "$BUILD_DIR/dfu32-${{ matrix.board }}-debug.bin"

      # The Component Manager rewrites the lock if the committed one doesn't
      # match what it resolves, and creates it if it is missing. Either way
      # the committed pin was not what this build used. Both variants resolve
      # the same lock, so the release job alone checks it.
      - name: Component lock unchanged
        if: matrix.variant == 'release'
        run: |
          if [ -n "$(git status --porcelain -- 'dependencies.lock*')" ]; then
            git status --short -- 'dependencies.lock*'
            git diff -- 'dependencies.lock*'
            echo "::error::the build changed dependencies.lock.*; build this profile locally and commit the result"
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      # Saved even when the build fails: a partially warm cache still helps
      # the next attempt.
      - name: Save ccache
        if: always() && steps.ccache-restore.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      # Where the bytes go, so a budget failure (next step) says what grew.
      - name: Size by component
        if: matrix.variant == 'release'
        run: |
          . "$IDF_PATH/export.sh"
          # Into a file first: piping straight into `head` kills idf.py with SIGPIPE.
          idf.py -B "$BUILD_DIR" size-components > size-components.txt 2>&1
          head -45 size-components.txt

      # Release-only: the budget leaves headroom in the image that ships. The
      # bench-only debug build just has to fit its OTA slot, which the IDF
      # build already enforces.
      - name: App size budget
        if: matrix.variant == 'release'
        run: python3 tools/check_app_size.py "$BUILD_DIR"

      - name: Merged image (single file, flash at 0x0)
        if: matrix.variant == 'release'
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --preset "${{ matrix.board }}" merge-bin -o "dfu32-${{ matrix.board }}-merged.bin"

      - name: Upload artifacts
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: dfu32-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/dfu32-${{ matrix.board }}-merged.bin
            build/${{ matrix.board }}/ota_data_initial.bin
            build/${{ matrix.board }}/dfu32.bin
            build/${{ matrix.board }}/dfu32.elf
            build/${{ matrix.board }}/bootloader/bootloader.bin
            build/${{ matrix.board }}/partition_table/partition-table.bin
            build/${{ matrix.board }}/flasher_args.json
            build/${{ matrix.board }}/sdkconfig
            dependencies.lock.*
          if-no-files-found: warn

      # Its own artifact, so nothing that picks up dfu32-<board> for a
      # release can ship the fault-injection build by accident.
      - name: Upload debug build (bench only, never release)
        if: matrix.variant == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: dfu32-${{ matrix.board }}-debug
          path: ${{ env.BUILD_DIR }}/dfu32-${{ matrix.board }}-debug.bin
          if-no-files-found: error
