name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host tests & layout checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Partition tables
        run: python3 tools/check_partitions.py partitions/4mb.csv:4M partitions/8mb.csv:8M

      - name: Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Configure
        run: cmake -S test/host -B build-host -G Ninja

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        board: [feather_esp32s3, feather_esp32_v2, esp32s3_n16r8]
    defaults:
      run:
        shell: bash
    env:
      # idf.py passes -DCCACHE_ENABLE=1 to CMake, which wraps the compilers in
      # ccache (preinstalled in the espressif/idf image). Set job-wide so the
      # merge-bin invocation sees the same value and doesn't reconfigure.
      IDF_CCACHE_ENABLE: 1
      CCACHE_MAXSIZE: 500M
      # Bump to invalidate every ccache entry (e.g. after an IDF image change).
      CCACHE_KEY_PREFIX: ccache-v1-idf6.1-${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      # ${{ github.workspace }} is the host path in container jobs, so derive
      # the container path from $GITHUB_WORKSPACE at runtime instead.
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      # Each run saves under a unique key; restore-keys picks the most recent
      # cache for this board (PRs can also read caches saved from main).
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_KEY_PREFIX }}-

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py -B "build/${{ matrix.board }}" -DDFU32_BOARD=${{ matrix.board }} build

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      # Save even when the build fails: a partially warm cache still helps
      # the next attempt.
      - name: Save ccache
        if: always() && steps.ccache-restore.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: App size budget
        run: python3 tools/check_app_size.py "build/${{ matrix.board }}"

      - name: Merged image (single file, flash at 0x0)
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B "build/${{ matrix.board }}" merge-bin -o "dfu32-${{ matrix.board }}-merged.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dfu32-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/dfu32-${{ matrix.board }}-merged.bin
            build/${{ matrix.board }}/ota_data_initial.bin
            build/${{ matrix.board }}/dfu32.bin
            build/${{ matrix.board }}/dfu32.elf
            build/${{ matrix.board }}/bootloader/bootloader.bin
            build/${{ matrix.board }}/partition_table/partition-table.bin
            build/${{ matrix.board }}/flasher_args.json
            build/${{ matrix.board }}/sdkconfig
            dependencies.lock
          if-no-files-found: warn
